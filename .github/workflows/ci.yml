name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sceneflow-ai-nextjs/package-lock.json

      - name: Install dependencies
        working-directory: sceneflow-ai-nextjs
        run: npm ci --no-audit --no-fund

      - name: Lint (soft-fail)
        working-directory: sceneflow-ai-nextjs
        run: npm run lint
        continue-on-error: true

      - name: Check circular dependencies
        working-directory: sceneflow-ai-nextjs
        run: npm run ci:circular

      # Soft-fail: ~800 pre-existing errors predate this workflow, and the app
      # ships with next.config.mjs `typescript.ignoreBuildErrors`, so tsc has
      # never gated a deploy. Surfaced here to track the debt without wedging CI.
      - name: TypeScript check (soft-fail)
        working-directory: sceneflow-ai-nextjs
        run: npx tsc --noEmit
        continue-on-error: true

      # i18n guards. These fail the build rather than soft-failing: each one
      # catches a defect that is silent at runtime.
      #  - a stale fingerprint means changed English is never re-translated
      #  - an unclassified prose field is never localized
      #  - a dropped ICU argument throws at format time, not at build time
      #  - a new hardcoded string un-translates a surface that was converted
      - name: i18n catalog check
        working-directory: sceneflow-ai-nextjs
        run: npm run i18n:app:check

      - name: i18n tests
        working-directory: sceneflow-ai-nextjs
        run: npm run test:i18n

      - name: i18n lint (converted surfaces)
        working-directory: sceneflow-ai-nextjs
        run: npm run lint:i18n

      # The real gate: mirrors what Vercel runs, so a red build means a red deploy.
      - name: Build
        working-directory: sceneflow-ai-nextjs
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npm run build



