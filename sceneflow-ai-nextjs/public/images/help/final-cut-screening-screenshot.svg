<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="720" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" rx="16" fill="url(#bg4)" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="52" rx="16" fill="#0B1120"/>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="26" cy="26" r="6" fill="#EF4444"/>
  <circle cx="46" cy="26" r="6" fill="#F59E0B"/>
  <circle cx="66" cy="26" r="6" fill="#10B981"/>
  <text x="96" y="31" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Final Cut • Screening Room &amp; Global Premiere</text>

  <!-- Stream Mode Selector in Header -->
  <rect x="490" y="11" width="310" height="30" rx="8" fill="#111827" stroke="#334155"/>
  <rect x="494" y="14" width="148" height="24" rx="6" fill="#06B6D4"/>
  <text x="514" y="30" fill="#042F2E" font-family="system-ui, sans-serif" font-size="11" font-weight="800">🎬 Master Video Stream</text>
  <text x="656" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🖼 Animatic Cut</text>

  <!-- Share Screening Link Button -->
  <rect x="820" y="11" width="176" height="30" rx="8" fill="#1E293B" stroke="#06B6D4"/>
  <text x="838" y="30" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🔗 Share /s/ Review Link</text>
  <rect x="1008" y="11" width="168" height="30" rx="8" fill="#10B981"/>
  <text x="1028" y="30" fill="#042F2E" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">⬇ Export MP4 Master</text>

  <!-- Cinema Screening Player -->
  <rect x="24" y="70" width="780" height="410" rx="14" fill="url(#screenGrad)" stroke="#334155" stroke-width="1.5"/>
  <!-- Letterbox bars -->
  <rect x="24" y="70" width="780" height="36" rx="14" fill="#020617"/>
  <rect x="24" y="444" width="780" height="36" rx="14" fill="#020617"/>
  <!-- Visual Cinema Frame -->
  <circle cx="414" cy="246" r="78" fill="#06B6D4" fill-opacity="0.16" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="414" cy="246" r="32" fill="#8B5CF6" fill-opacity="0.35"/>
  <polygon points="406,232 406,260 430,246" fill="#FFFFFF"/>

  <!-- Burnt-in / Closed Caption Preview -->
  <rect x="174" y="394" width="480" height="34" rx="6" fill="#020617" fill-opacity="0.82"/>
  <text x="206" y="416" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">"Beneath forty miles of ice, the signal is answering."</text>

  <!-- Language & Audio Stream Switcher Bar below Player -->
  <rect x="24" y="494" width="780" height="158" rx="14" fill="#0B1120" stroke="#1E293B" stroke-width="1.5"/>
  <text x="46" y="524" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="0.8">MULTILINGUAL AUDIO &amp; SUBTITLE DUBBING STREAMS (13+ LANGUAGES)</text>

  <rect x="46" y="540" width="110" height="34" rx="8" fill="#06B6D4"/>
  <text x="62" y="561" fill="#042F2E" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">🇺🇸 English</text>

  <rect x="166" y="540" width="110" height="34" rx="8" fill="#111827" stroke="#334155"/>
  <text x="182" y="561" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">🇪🇸 Español</text>

  <rect x="286" y="540" width="110" height="34" rx="8" fill="#111827" stroke="#334155"/>
  <text x="302" y="561" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">🇯🇵 日本語</text>

  <rect x="406" y="540" width="110" height="34" rx="8" fill="#111827" stroke="#334155"/>
  <text x="422" y="561" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">🇫🇷 Français</text>

  <rect x="526" y="540" width="110" height="34" rx="8" fill="#111827" stroke="#334155"/>
  <text x="542" y="561" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">🇩🇪 Deutsch</text>

  <rect x="646" y="540" width="136" height="34" rx="8" fill="#1E1B4B" stroke="#8B5CF6"/>
  <text x="662" y="561" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">+ 8 More Tracks</text>

  <text x="46" y="604" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Per-Scene Stream Override: Mix high-res Animatic keyframes with hero motion video clips seamlessly in a single timeline.</text>
  <text x="46" y="628" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✓ Automatic loudness normalization (-14 LUFS) &amp; dialogue ducking applied on Master Export</text>

  <!-- Right Panel: Audience Screening Room & Reviewer Feedback -->
  <rect x="822" y="70" width="354" height="582" rx="14" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
  <text x="846" y="102" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Audience Screening &amp; Export</text>
  <text x="846" y="122" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Share a private `/s/` screening link with clients or test audiences</text>

  <!-- Share Link Box -->
  <rect x="844" y="140" width="310" height="78" rx="10" fill="#0B1120" stroke="#06B6D4" stroke-opacity="0.5"/>
  <text x="860" y="164" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">PUBLIC / PRIVATE SCREENING URL</text>
  <text x="860" y="186" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">sceneflowai.studio/s/europa-freq-v2</text>
  <text x="860" y="204" fill="#10B981" font-family="system-ui, sans-serif" font-size="10">✓ Timestamped viewer reactions enabled</text>

  <!-- Time-coded Comments -->
  <text x="846" y="246" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Reviewer Timestamped Notes</text>

  <rect x="844" y="260" width="310" height="74" rx="8" fill="#0B1120" stroke="#1E293B"/>
  <text x="860" y="282" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">@ 00:42 • Executive Producer</text>
  <text x="860" y="302" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">"Love the crimson sonar reveal in Scene 3.</text>
  <text x="860" y="318" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Hold the close-up 1 second longer!"</text>

  <rect x="844" y="344" width="310" height="74" rx="8" fill="#0B1120" stroke="#1E293B"/>
  <text x="860" y="366" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">@ 01:18 • Sound Supervisor</text>
  <text x="860" y="386" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">"Spanish &amp; Japanese dub tracks are</text>
  <text x="860" y="402" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">locked and synced with subtitles."</text>

  <!-- Premiere Promo Kit Generator -->
  <rect x="844" y="438" width="310" height="190" rx="10" fill="#1E1B4B" stroke="#8B5CF6"/>
  <text x="864" y="464" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="800">🚀 PREMIERE LAUNCH KIT</text>
  <text x="864" y="488" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1-Click Distribution Assets</text>
  <text x="864" y="512" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="11">• Theatrical Poster &amp; 16:9 / 9:16 Thumbnails</text>
  <text x="864" y="532" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="11">• Festival Synopsis &amp; Director's Statement</text>
  <text x="864" y="552" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="11">• Multi-Language SRT/VTT Caption Bundle</text>
  <rect x="864" y="572" width="270" height="38" rx="8" fill="#10B981"/>
  <text x="916" y="596" fill="#042F2E" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Export Full Premiere Package</text>
</svg>
